    <div class="main-container">
    <div class="form-container">
        <h1>Formulir Pengajuan Surat Izin</h1>

        <Form action="proses_surat.php" method="post"
        target="_blank"onsubmit="retrun validasiform()">
            <div class="form-group"> 
                <label for="Nama">Nama Lengkap:</label>
                <input type="text"name="nama" id="nama" required placeholder="contoh: BelMir">
 </div>

 <div class="form-group">
                <label for="NIS">NIS:</label>
                 <input type="number" name="nis" id="nis" required placeholder="Contoh:257089">

</div>

<div class="form-group">
    <label for="Kelas">Kelas:</label>
    <input type="text" name="kelas" id="kelas" required placeholder="Contoh:XI RPL 1">

 </div>

 <div class="form-group">
    <label for="alasan">Alasan Izin:</label>
    <Select name="alasan" id="alasan" required>
        <option value="">--Pilih Alasan--</option>
        <option value="Sakit">Sakit</option>
        <option value="Acara Keluarga">Acara Keluarga</option>
        <option value="Keperluan Magang">Keperluan Magang</option>
        <option value="Izin terlambat">Izin terlambat</option>
    </Select>
 </div>

    <div class="form-row">
        <div class="form-group half">
            <label for="Tanggal mulai">Tanggal Mulai:</label>
            <input type="date" name="tgl_mulai" id="tgl_mulai" required>
        </div>
        <div class="form-group half">
            <label for="Tanggal Selesi">Tanggal Selesai:</label>
            <input type="date" name="tgl_selesai" id="tgl_selesai" required>
        </div>

    </div>
        <div class="form-group">
            <label for="Keterangan">Keterangan / Detail Alasan:</label>
            <textarea name="keterangan" rows="3" id="keterangan" placeholder="Masukkan detail alasan..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Buat Surat</button>         
    </Form>
    </div>
</div>
</body>
